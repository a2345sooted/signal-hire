services:
  db:
    image: pgvector/pgvector:pg15
    container_name: signal-db
    environment:
      POSTGRES_DB: ${DB_NAME:-signal}
      POSTGRES_USER: ${DB_USER:-local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway
    container_name: signal-flyway
    command: -url=jdbc:postgresql://db:5432/${DB_NAME:-signal} -user=${DB_USER:-local} -password=${DB_PASSWORD:-local} migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
